[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-classification"
version = "0.1.0"
description = "Reproducible Iris classification with EDA, tuning, explainability, and monitoring."
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "seaborn>=0.12",
    "shap>=0.44",
]

[tool.setuptools.packages.find]
where = ["src"]
